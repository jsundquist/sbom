# Dependency lifecycle scripts are blocked unless listed here.
allowBuilds:
  esbuild: true
  # Native resolver used by eslint-plugin-import; prebuilt binaries ship as optional deps, so the script is not needed.
  unrs-resolver: false

# Refuse versions published less than 1 day ago (minutes). Applies to manual
# `pnpm add` and fresh resolution; dependabot adds its own 7-day cooldown.
# Raise this once the project's dependencies settle (a 7-day window flagged
# 40+ entries in the lockfile at migration time).
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # Already in the lockfile when migrating from npm; remove on or after
  # 2026-10-21 once they are past the cutoff.
  - '@electric-sql/pglite@0.5.10'
  - '@next/env@16.4.1'
  - '@next/swc-darwin-arm64@16.4.1'
  - '@next/swc-darwin-x64@16.4.1'
  - '@next/swc-linux-arm64-gnu@16.4.1'
  - '@next/swc-linux-arm64-musl@16.4.1'
  - '@next/swc-linux-x64-gnu@16.4.1'
  - '@next/swc-linux-x64-musl@16.4.1'
  - '@next/swc-win32-arm64-msvc@16.4.1'
  - '@next/swc-win32-x64-msvc@16.4.1'
  - 'next@16.4.1'
  - 'react-dom@19.3.1'
  - 'react-is@19.3.1'
  - 'react@19.3.1'

# Accepted audit findings. Keep each entry narrow and say why.
auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 stack exhaustion on deeply nested patterns. No patched release exists yet (3.0.3 is the latest).
    # Dev-only: reached through eslint-config-next > @next/eslint-plugin-next > fast-glob > micromatch, where braces
    # only expands the fixed glob patterns of our own ESLint config, never untrusted input. Remove once braces >= 3.0.4 ships.
    - GHSA-vfj7-8cjw-p6xm
