name: Release image
# Builds the single runtime image (web, worker and migrate all run from it), scans it, and publishes it to GHCR.
# The tag is <short-sha>-<run_number>; deploy tooling picks it up from there. Nothing else is written or bumped.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/jsundquist/sbom

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compute tag
        id: tag
        env:
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: echo "value=${SHA::7}-${RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Built into the local Docker store (not pushed) so the scan and the push use the exact same image.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Same exclusion as security.yml: npm's own bundled modules ship with the base image.
          skip-dirs: usr/local/lib/node_modules/npm
          exit-code: '1'
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: docker push "${IMAGE}:${TAG}"
