name: Release image
# Builds the two runtime images (web; worker, which also runs migrate), scans them, and publishes them to GHCR.
# The tag is <short-sha>-<run_number>. The bump job then pins it in jsundquist/k8s-gitops, which Argo CD syncs.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/jsundquist/sbom
  WORKER_IMAGE: ghcr.io/jsundquist/sbom-worker

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compute tag
        id: tag
        env:
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: echo "value=${SHA::7}-${RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Built into the local Docker store (not pushed) so the scan and the push use the exact same image.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: web
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: worker
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.WORKER_IMAGE }}:${{ steps.tag.outputs.value }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Same exclusion as security.yml: npm's own bundled modules ship with the base image.
          skip-dirs: usr/local/lib/node_modules/npm
          exit-code: '1'
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.WORKER_IMAGE }}:${{ steps.tag.outputs.value }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: usr/local/lib/node_modules/npm
          exit-code: '1'
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          docker push "${IMAGE}:${TAG}"
          docker push "${WORKER_IMAGE}:${TAG}"

  bump:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      GITOPS_REPO: jsundquist/k8s-gitops
    steps:
      # The bump step pushes with the persisted token, so credentials stay on purpose.
      - name: Checkout GitOps repo # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Pin new image tag and push
        env:
          NEW_TAG: ${{ needs.image.outputs.tag }}
          FILE: apps/sbom/kustomization.yaml
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Returns 1 when the file already pins NEW_TAG (nothing to commit)
          pin_and_commit() {
            yq -i '.images[0].newTag = strenv(NEW_TAG)' "$FILE"
            # No-op until k8s-gitops lists the worker image.
            yq -i '(.images[] | select(.name == "ghcr.io/jsundquist/sbom-worker") | .newTag) = strenv(NEW_TAG)' "$FILE"
            if git diff --quiet; then
              return 1
            fi
            git commit -qam "chore(sbom): deploy $NEW_TAG"
          }

          if ! pin_and_commit; then
            echo "$FILE already pins $NEW_TAG, nothing to do"
            exit 0
          fi

          branch=$(git rev-parse --abbrev-ref HEAD)
          attempts=3
          for attempt in $(seq 1 "$attempts"); do
            if git pull --rebase origin "$branch" && git push origin "HEAD:$branch"; then
              exit 0
            fi
            echo "::warning::Push attempt $attempt/$attempts failed"
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" -eq "$attempts" ]; then
              break
            fi
            sleep $((attempt * 5))
            # A rebase conflict means a human edited the same line; start over from upstream
            git fetch -q origin "$branch"
            git reset -q --hard "origin/$branch"
            if ! pin_and_commit; then
              echo "$FILE already pins $NEW_TAG, nothing to do"
              exit 0
            fi
          done
          echo "::error::Could not push $NEW_TAG to $GITOPS_REPO after $attempts attempts; this deploy was skipped"
          exit 1

  token-expiry:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    env:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
      WARN_DAYS: 14
    steps:
      - name: Check GITOPS_TOKEN expiry
        run: |
          set -euo pipefail
          headers=$(mktemp)
          code=$(curl -sS -o /dev/null -D "$headers" -w '%{http_code}' \
            -H "Authorization: Bearer $GITOPS_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/rate_limit)
          if [ "$code" != "200" ]; then
            echo "::error::GITOPS_TOKEN was rejected by the GitHub API (HTTP $code). It has probably expired or been revoked; the deploy bump will fail until it is replaced."
            exit 1
          fi

          expiry=$(grep -i '^github-authentication-token-expiration:' "$headers" | cut -d' ' -f2- | tr -d '\r' || true)
          if [ -z "$expiry" ]; then
            echo "::notice::No token expiration header returned; GITOPS_TOKEN does not appear to expire"
            exit 0
          fi

          days=$(( ($(date -u -d "$expiry" +%s) - $(date -u +%s)) / 86400 ))
          if [ "$days" -lt "$WARN_DAYS" ]; then
            echo "::error::GITOPS_TOKEN expires in $days day(s) ($expiry). Create a new fine-grained PAT for jsundquist/k8s-gitops (Contents: read/write) and update the GITOPS_TOKEN secret before then."
            exit 1
          fi
          echo "GITOPS_TOKEN valid for $days more days"
