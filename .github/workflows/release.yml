name: Release image
# Builds the two runtime images (web; worker, which also runs migrate), scans them, and publishes them to GHCR.
# The tag is <short-sha>-<run_number>. The bump job then pins it in jsundquist/k8s-gitops, which Argo CD syncs.
# Assumes the ruleset on main (reviewed PRs, required CI and security checks, no bypass actors): this workflow runs on
# every push to main independently of those workflows, so only merged, checked code reaches the build.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/jsundquist/sbom
  WORKER_IMAGE: ghcr.io/jsundquist/sbom-worker

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.value }}
      web_digest: ${{ steps.digests.outputs.web }}
      worker_digest: ${{ steps.digests.outputs.worker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compute tag
        id: tag
        env:
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: echo "value=${SHA::7}-${RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Built into the local Docker store (not pushed) so the scan and the push use the exact same image.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: web
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: worker
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.WORKER_IMAGE }}:${{ steps.tag.outputs.value }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Same exclusion as security.yml: npm's own bundled modules ship with the base image.
          skip-dirs: usr/local/lib/node_modules/npm
          exit-code: '1'
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.WORKER_IMAGE }}:${{ steps.tag.outputs.value }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: usr/local/lib/node_modules/npm
          exit-code: '1'
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          docker push "${IMAGE}:${TAG}"
          docker push "${WORKER_IMAGE}:${TAG}"

      - name: Resolve pushed digests
        id: digests
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          echo "web=$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"
          echo "worker=$(docker buildx imagetools inspect "${WORKER_IMAGE}:${TAG}" --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"

  # Separate job so only it gets id-token and attestations: write. Everything here addresses the images by digest.
  sign:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign images (keyless)
        env:
          WEB_DIGEST: ${{ needs.image.outputs.web_digest }}
          WORKER_DIGEST: ${{ needs.image.outputs.worker_digest }}
        run: |
          cosign sign --yes "${IMAGE}@${WEB_DIGEST}"
          cosign sign --yes "${WORKER_IMAGE}@${WORKER_DIGEST}"
      # actions/attest-build-provenance v4 is a thin wrapper over actions/attest, which new workflows should use.
      # create-storage-record is off because it needs artifact-metadata: write, beyond the permissions this job is allowed.
      - name: Attest build provenance (web)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.image.outputs.web_digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest build provenance (worker)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.WORKER_IMAGE }}
          subject-digest: ${{ needs.image.outputs.worker_digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Generate image SBOM (web)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ needs.image.outputs.web_digest }}
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/web.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate image SBOM (worker)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.WORKER_IMAGE }}@${{ needs.image.outputs.worker_digest }}
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/worker.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest SBOM (web)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.image.outputs.web_digest }}
          sbom-path: ${{ runner.temp }}/web.cdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Attest SBOM (worker)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.WORKER_IMAGE }}
          subject-digest: ${{ needs.image.outputs.worker_digest }}
          sbom-path: ${{ runner.temp }}/worker.cdx.json
          push-to-registry: true
          create-storage-record: false

  # bump writes the tag and the signed image digest together (kustomize renders name:tag@sha256:...), so the cluster
  # runs exactly the image that was scanned, signed and attested, not whatever the tag points to later.
  bump:
    needs: [image, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      GITOPS_REPO: jsundquist/k8s-gitops
    steps:
      # The bump step pushes with the persisted token, so credentials stay on purpose.
      - name: Checkout GitOps repo # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Pin new image tag and push
        env:
          NEW_TAG: ${{ needs.image.outputs.tag }}
          WEB_DIGEST: ${{ needs.image.outputs.web_digest }}
          WORKER_DIGEST: ${{ needs.image.outputs.worker_digest }}
          FILE: apps/sbom/kustomization.yaml
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Never write a tag without a valid digest for it
          for d in "$WEB_DIGEST" "$WORKER_DIGEST"; do
            [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Not a valid image digest: '${d}'"; exit 1; }
          done

          # Returns 1 when the file already pins NEW_TAG and both digests (nothing to commit).
          # Tag and digest are written together and read back. The explicit "|| exit 1" matters: set -e is off inside
          # a function that is called from an if, so a failed check would otherwise be ignored.
          pin_and_commit() {
            yq -i '
              (.images[] | select(.name == "ghcr.io/jsundquist/sbom") | .newTag) = strenv(NEW_TAG) |
              (.images[] | select(.name == "ghcr.io/jsundquist/sbom") | .digest) = strenv(WEB_DIGEST) |
              (.images[] | select(.name == "ghcr.io/jsundquist/sbom-worker") | .newTag) = strenv(NEW_TAG) |
              (.images[] | select(.name == "ghcr.io/jsundquist/sbom-worker") | .digest) = strenv(WORKER_DIGEST)
            ' "$FILE" || exit 1
            yq -e '[.images[] | select(.name == "ghcr.io/jsundquist/sbom" and .newTag == strenv(NEW_TAG) and .digest == strenv(WEB_DIGEST))] | length == 1' "$FILE" >/dev/null \
              || { echo "::error::${FILE} does not pin the web image after the update"; exit 1; }
            yq -e '[.images[] | select(.name == "ghcr.io/jsundquist/sbom-worker" and .newTag == strenv(NEW_TAG) and .digest == strenv(WORKER_DIGEST))] | length == 1' "$FILE" >/dev/null \
              || { echo "::error::${FILE} does not pin the worker image after the update"; exit 1; }
            if git diff --quiet; then
              return 1
            fi
            git commit -qam "chore(sbom): deploy $NEW_TAG"
          }

          if ! pin_and_commit; then
            echo "$FILE already pins $NEW_TAG, nothing to do"
            exit 0
          fi

          branch=$(git rev-parse --abbrev-ref HEAD)
          attempts=3
          for attempt in $(seq 1 "$attempts"); do
            if git pull --rebase origin "$branch" && git push origin "HEAD:$branch"; then
              exit 0
            fi
            echo "::warning::Push attempt $attempt/$attempts failed"
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" -eq "$attempts" ]; then
              break
            fi
            sleep $((attempt * 5))
            # A rebase conflict means a human edited the same line; start over from upstream
            git fetch -q origin "$branch"
            git reset -q --hard "origin/$branch"
            if ! pin_and_commit; then
              echo "$FILE already pins $NEW_TAG, nothing to do"
              exit 0
            fi
          done
          echo "::error::Could not push $NEW_TAG to $GITOPS_REPO after $attempts attempts; this deploy was skipped"
          exit 1

  # Keeps the newest KEEP image versions per package and deletes older ones together with their cosign signature tags
  # (sha256-<digest>.sig). Untagged versions (attestations and SBOMs pushed as referrers) are never deleted, so nothing a
  # kept image references can be removed. Dry run unless the repo variable GHCR_PRUNE_ENABLED is 'true'. Deleting needs
  # this repository to have Admin on each package ("Manage Actions access").
  prune:
    needs: [image, bump]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package: [sbom, sbom-worker]
    env:
      GITOPS_REPO: jsundquist/k8s-gitops
      KEEP: 10
      OWNER: ${{ github.repository_owner }}
      PACKAGE: ${{ matrix.package }}
      NEW_TAG: ${{ needs.image.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DRY_RUN: ${{ vars.GHCR_PRUNE_ENABLED == 'true' && 'false' || 'true' }}
    steps:
      - name: Prune old image versions
        run: |
          set -euo pipefail

          # Never delete what the GitOps repo currently pins (covers manual rollbacks too)
          deployed=$(curl -fsSL "https://raw.githubusercontent.com/$GITOPS_REPO/HEAD/apps/sbom/kustomization.yaml" \
            | NAME="ghcr.io/$OWNER/$PACKAGE" yq '.images[] | select(.name == strenv(NAME)) | .newTag')
          if [ -z "$deployed" ] || [ "$deployed" = "null" ]; then
            echo "::error::Could not read the deployed tag for $PACKAGE from $GITOPS_REPO; refusing to prune"
            exit 1
          fi
          protected=$(jq -nc --arg a "$NEW_TAG" --arg b "$deployed" '[$a, $b]')
          echo "Protected tags: $protected (dry run: $DRY_RUN)"

          gh api --paginate "/users/$OWNER/packages/container/$PACKAGE/versions?per_page=100" | jq -s 'add' > versions.json

          # Image versions are those with a tag that is not a sha256-<digest>.<suffix> signature tag. Keep the newest KEEP
          # of them plus the protected tags; delete the rest and the signature tags that point at the deleted digests.
          jq -c --argjson keep "$KEEP" --argjson prot "$protected" '
            def tags: .metadata.container.tags // [];
            def itags: tags | map(select(startswith("sha256-") | not));
            sort_by(.created_at) | reverse as $all
            | ($all | map(select(itags | length > 0))) as $images
            | ($images[:$keep] + ($images | map(select(itags | any(.[]; IN($prot[])))))) as $kept
            | ($kept | map(.name)) as $keptDigests
            | ($images | map(select(. as $v | ($keptDigests | index($v.name)) == null))) as $drop
            | ($drop | map("sha256-" + (.name | ltrimstr("sha256:")))) as $sigPrefixes
            | ($drop[] | {id, created_at, tags: tags}),
              ($all[] | select((itags | length) == 0 and (tags | length) > 0
                  and (tags | any(.[]; . as $t | $sigPrefixes | any(. as $p | $t | startswith($p + ".")))))
                | {id, created_at, tags: tags})
          ' versions.json > delete.jsonl

          echo "Total versions: $(jq length versions.json), to delete: $(wc -l < delete.jsonl | tr -d ' ')"
          cat delete.jsonl

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run, nothing deleted"
            exit 0
          fi

          failed=0
          while read -r id; do
            gh api -X DELETE "/users/$OWNER/packages/container/$PACKAGE/versions/$id" || failed=$((failed + 1))
          done < <(jq -r '.id' delete.jsonl)
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed version(s) could not be deleted"
            exit 1
          fi

  token-expiry:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    env:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
      WARN_DAYS: 14
    steps:
      - name: Check GITOPS_TOKEN expiry
        run: |
          set -euo pipefail
          headers=$(mktemp)
          code=$(curl -sS -o /dev/null -D "$headers" -w '%{http_code}' \
            -H "Authorization: Bearer $GITOPS_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/rate_limit)
          if [ "$code" != "200" ]; then
            echo "::error::GITOPS_TOKEN was rejected by the GitHub API (HTTP $code). It has probably expired or been revoked; the deploy bump will fail until it is replaced."
            exit 1
          fi

          expiry=$(grep -i '^github-authentication-token-expiration:' "$headers" | cut -d' ' -f2- | tr -d '\r' || true)
          if [ -z "$expiry" ]; then
            echo "::notice::No token expiration header returned; GITOPS_TOKEN does not appear to expire"
            exit 0
          fi

          days=$(( ($(date -u -d "$expiry" +%s) - $(date -u +%s)) / 86400 ))
          if [ "$days" -lt "$WARN_DAYS" ]; then
            echo "::error::GITOPS_TOKEN expires in $days day(s) ($expiry). Create a new fine-grained PAT for jsundquist/k8s-gitops (Contents: read/write) and update the GITOPS_TOKEN secret before then."
            exit 1
          fi
          echo "GITOPS_TOKEN valid for $days more days"
