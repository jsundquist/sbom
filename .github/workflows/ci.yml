name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sbom
          POSTGRES_PASSWORD: sbom
          POSTGRES_DB: sbom_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sbom" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Check migrations are up to date with the schema
        run: |
          npx drizzle-kit generate --name ci-check
          git diff --exit-code --stat -- drizzle || { echo "::error::Schema changed without a migration. Run npm run db:generate."; exit 1; }
          test -z "$(git status --porcelain -- drizzle)" || { echo "::error::Schema changed without a migration. Run npm run db:generate."; git status --porcelain -- drizzle; exit 1; }
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
