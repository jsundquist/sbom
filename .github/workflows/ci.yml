name: CI
# Runs on every push to any branch (pull request branches included), so each push is built, linted and tested.
on:
  push:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: sbom
          POSTGRES_PASSWORD: sbom
          POSTGRES_DB: sbom_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sbom" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
      - name: Type-check
        run: pnpm run typecheck
      - name: ESLint
        run: pnpm run lint:eslint
      - name: Prettier
        run: pnpm run format:check
      - run: pnpm test
      - name: Check migrations are up to date with the schema
        run: |
          pnpm exec drizzle-kit generate --name ci-check
          git diff --exit-code --stat -- drizzle || { echo "::error::Schema changed without a migration. Run pnpm run db:generate."; exit 1; }
          test -z "$(git status --porcelain -- drizzle)" || { echo "::error::Schema changed without a migration. Run pnpm run db:generate."; git status --porcelain -- drizzle; exit 1; }
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
