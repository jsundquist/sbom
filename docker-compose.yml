# Local / self-hosted stack: Postgres, migrations, web app and enrichment worker.
#   docker compose up --build        -> http://localhost:3000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sbom
      POSTGRES_PASSWORD: sbom
      POSTGRES_DB: sbom
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sbom']
      interval: 2s
      retries: 30

  migrate:
    build: .
    command: ['npm', 'run', 'db:migrate']
    environment: &env
      DATABASE_URL: postgres://sbom:sbom@db:5432/sbom
      UPLOAD_TOKENS: ${UPLOAD_TOKENS:-}
      ALLOW_OPEN_UPLOADS: ${ALLOW_OPEN_UPLOADS:-false}
    depends_on:
      db: { condition: service_healthy }

  web:
    build: .
    environment: *env
    ports: ['3000:3000']
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  worker:
    build: .
    command: ['npm', 'run', 'worker']
    environment: *env
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

volumes:
  pgdata:
